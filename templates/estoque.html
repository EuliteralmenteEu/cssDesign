<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque</title>
    <link rel="stylesheet" href="../static/style2.css">
</head>
<body>
    <div id="senai">
        <a href="/">
            <img src="../static/senailogo.png" id="imagemSenai">
        </a>
    </div>
    <div id="estoque">
        <p>Estoque</p>
    </div>
    <div id="tabela">
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Quantidade</th>
                    <th>Preço</th>
                    <th>Categoria</th>
                    <th>Descrição</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Martelo</td>
                    <td>20</td>
                    <td>29.99R$</td>
                    <td>Ferramentas</td>
                    <td>Bate nas coisas</td>
                </tr>
                <tr>
                    <td>Trena</td>
                    <td>12</td>
                    <td>39.99R$</td>
                    <td>Medição</td>
                    <td>Mede as coisas</td>
                </tr>
            </tbody>
        </table>
    </div>
    <div id="adicionar">
        <a href="/adicionar">
            <button class="btn btn-primary align-self-center">Adicionar</button>
        </a>
    </div>
</body>
</html>
