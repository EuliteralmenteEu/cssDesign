<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar</title>
    <link rel="stylesheet" href="../static/style2.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
    <div id="senai">
        <a href="/">
            <img src="../static/senailogo.png" id="imagemSenai">
        </a>
    </div>
    <div id="estoque">
        <p>Adicionar</p>
    </div>
    <div id="tabela">
        <form action="/estoque" method="GET">
            <div class="form-field flex-1 mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" required>
                <div class="invalid-feedback">Campo obrigatório.</div>
            </div>
            <div class="form-field flex-1 mb-3">
                <label for="quantidade" class="form-label">Quantidade</label>
                <input type="text" class="form-control" id="quantidade" required>
                <div class="invalid-feedback">Campo obrigatório.</div>
            </div>
            <div class="form-field flex-1 mb-3">
                <label for="preco" class="form-label">Preço</label>
                <input type="text" class="form-control" id="preco" required>
                <div class="invalid-feedback">Campo obrigatório.</div>
            </div>
            <div class="form-field flex-1 mb-3">
                <label for="categoria" class="form-label">Categoria</label>
                <input type="text" class="form-control" id="categoria" required>
                <div class="invalid-feedback">Campo obrigatório.</div>
            </div>
            <div class="form-field flex-1 mb-3">
                <label for="descricao" class="form-label">Descrição</label>
                <input type="text" class="form-control" id="descricao" required>
                <div class="invalid-feedback">Campo obrigatório.</div>
            </div>
            <button type="submit" class="btn-solid theme-primary">Enviar</button>
        </form>
    </div>
</body>
</html>
