<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="../static/style.css">
    <title>Almoxarifado</title>
</head>
<body>
    <div id="imagem">
        <img src="../static/senaiLogin.jpeg">
    </div>
    <div id="login">
        <form action="/estoque" method="GET">
            <div id="imagemLogo">
                <img src="../static/senailogo.png">
            </div><br><br>
            <div class="form-field flex-1 mb-3">
                <label for="fieldValidateEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="fieldValidateEmail" required>
                <div class="invalid-feedback">Email incorreto.</div>
            </div>
            <div class="form-field flex-1 mb-3">
                <label for="fieldValidate" class="form-label">Senha</label>
                <input type="password" class="form-control" id="fieldValidate" required>
                <div class="invalid-feedback">Senha incorreta.</div>
            </div>
            <div>
                <button type="submit" class="btn btn-primary align-self-center">Entrar</button>
            </div>
        </form>
    </div>
</body>
</html>
